name: Release

# Publishes a GitHub release (which the in-app updater downloads) whenever the
# version in CMakeLists.txt changes on main and no release exists for it yet.
# Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [CMakeLists.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja qt6-base mpv ffmpeg github-cli

      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          version=$(sed -n 's/^project(clipstash VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists, nothing to do."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.publish == 'yes'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCLIPSTASH_TESTS=ON
          cmake --build build

      - name: Test
        if: steps.version.outputs.publish == 'yes'
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Package
        if: steps.version.outputs.publish == 'yes'
        run: |
          strip build/clipstash
          cp build/clipstash clipstash-x86_64
          sha256sum clipstash-x86_64 > clipstash-x86_64.sha256

      - name: Publish release
        if: steps.version.outputs.publish == 'yes'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" clipstash-x86_64 clipstash-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" --generate-notes
